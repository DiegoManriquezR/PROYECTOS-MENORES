<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Comunicate</title>

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />

  <style>
    body {
      background-color: #f4f6f8;
    }
    .navbar {
      background-color: #0E1A40;
    }
    h2 {
      color: #0E1A40;
      font-family: 'Georgia', serif;
    }
    .btn-primary {
      background-color: #946B2D;
      border-color: #946B2D;
    }
    .btn-primary:hover {
      background-color: #7a561f;
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
      <a class="navbar-brand d-flex align-items-center" href="#">
        <img src="img/foto4.png" alt="Logo Hogwarts" style="height: 200px; width: auto; margin-right: 8px;">
        Libreria Hogwarts
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="catalogolibros.html">Catálogo de Libros</a></li>
          <li class="nav-item"><a class="nav-link active" href="contacto.html">Contacto</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container mt-5">
    <h2>Comunícate con nosotros</h2>
    <form id="formContacto" novalidate>
      <div class="mb-3">
        <label>Nombre</label>
        <input type="text" class="form-control" id="nombreContacto" required>
      </div>
      <div class="mb-3">
        <label>Correo Electrónico</label>
        <input type="email" class="form-control" id="emailContacto" required>
      </div>
      <div class="mb-3">
        <label>Tema a tratar</label>
        <textarea class="form-control" id="mensajeContacto" rows="4" required></textarea>
      </div>
      <button type="submit" class="btn btn-primary">Enviar</button>
    </form>
  </main>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="funcionescrud.js"></script>
</body>
</html>
