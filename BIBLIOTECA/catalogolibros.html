<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Colección de Escritos</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />

  <style>
    body {
      background-color: #f8f9fa;
    }
    .navbar {
      background-color: #1A472A;
    }
    h2 {
      font-family: 'Georgia', serif;
      color: #1A472A;
    }
    .table thead {
      background-color: #1A472A;
      color: white;
    }
    .btn-primary {
      background-color: #1A472A;
      border-color: #1A472A;
    }
    .btn-warning {
      background-color: #AAAAAA;
      border-color: #999999;
    }
    .btn-danger {
      background-color: #7f0000;
    }
  </style>
</head>

<body>

  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
      <a class="navbar-brand d-flex align-items-center" href="#">
        <img src="img/foto2.png" alt="Logo Hogwarts" style="height: 200px; width: auto; margin-right: 8px;">
        Libreria Hogwarts
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link active" href="catalogolibros.html">Catálogo de Libros</a></li>
          <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    <h2 class="mb-4">Control de Escritos</h2>

    <div class="d-flex flex-wrap justify-content-between mb-3 gap-2">
      <input type="text" id="buscarInput" class="form-control me-2" placeholder="Buscar por título o autor" />
      <select id="filtroGenero" class="form-select me-2">
        <option value="">Todos los géneros</option>
        <option value="Hechizos">Hechizos</option>
        <option value="Pociones">Pociones</option>
        <option value="Animales Fantasticos">Animales Fantasticos</option>
        <option value="Historia de la Magia">Historia de la Magia</option>
      </select>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalLibro">
        <i class="bi bi-plus-circle me-1"></i> Agregar Escrito
      </button>
    </div>

    <table class="table table-bordered table-striped">
      <thead>
        <tr>
          <th>Título</th>
          <th>Autor</th>
          <th>Género</th>
          <th>Año</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tablaLibros"></tbody>
    </table>
  </div>


  <div class="modal fade" id="modalLibro" tabindex="-1">
    <div class="modal-dialog">
      <form id="formLibro" class="modal-content needs-validation" novalidate>
        <div class="modal-header bg-success text-white">
          <h5 class="modal-title">Agregar / Editar Escrito</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="idLibro">
          <div class="mb-3">
            <label>Título</label>
            <input type="text" class="form-control" id="titulo" required minlength="3" />
          </div>
          <div class="mb-3">
            <label>Autor</label>
            <input type="text" class="form-control" id="autor" required minlength="3" />
          </div>
          <div class="mb-3">
            <label>Género</label>
            <select id="genero" class="form-select" required>
              <option value="">Seleccione</option>
              <option>Hechizos</option>
              <option>Pociones</option>
              <option>Animales Fantasticos</option>
              <option>Historia de la Magia</option>
            </select>
          </div>
          <div class="mb-3">
            <label>Año</label>
            <input type="number" class="form-control" id="anio" required min="1900" />
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" type="button" data-bs-dismiss="modal">Cancelar</button>
          <button class="btn btn-primary" type="submit">Guardar</button>
        </div>
      </form>
    </div>
  </div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="funcionescrud.js"></script>
</body>
</html>
