<!DOCTYPE html>  
<html lang="es">
<head>
    <meta charset="UFT-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD JS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
            CRUD - JS
            </a>
            <button type="button" class="btn btn-outline-light" data-bs-toggle="modal" data-bs-target="#modalProductos" onclick="abrirFormulario()">Agregar Productos</button>
        </div>
    </nav>


    <div class="container mt-5">
        <h2 class="mb-4">Productos Registrados</h2>
        <table class="table table-hover table-bordered table-responsive">
            <thead class="table-dark">
                <tr>
                    <td>Nombre</td>
                    <td>Precio</td>
                    <td>Categoria</td>
                    <td>Descripción</td>
                    <td>Acciones</td>
                </tr>
            </thead>
            <tbody id="tabla-productos">
                <!-- se cargaran los productos aqui-->
            </tbody>
        </table>
    </div>


    <div class="modal fade" id="modalProductos" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
          <form id="formulario" class="modal-content">
            <div class="modal-header">
              <h1 class="modal-title fs-5" id="exampleModalLabel">Productos</h1>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <div id="alerta" class="alert alert-danger d-none" role="alert">
                Ingrese todos los datos solicitados!!!
              </div>
            

              <input type="hidden" id="filaEditando">

              <div class="mb-3">
                <label for="nombre" class="form-label">Nombre:</label>
                <input type="text" class="form-control" id="nombre">
              </div>

              <div class="mb3">
                <label for="precio" class="form-label">Precio:</label>
                <input type="number" class="form-control" id="precio">
              </div>

              <div class="mb-3">
                <label for="categoria" class="form-label">Categoria:</label>
                <select class="form-select" id="categoria">
                    <option value="">Seleccione una opcion</option>
                    <option value="hogar">Hogar</option>
                    <option value="electronica">Electro</option>
                    <option value="ropa">Ropa</option>
                </select>
              </div>

              <div class="mb-3">
                <label for="descripcion" class="form-label">Descripción:</label>
                <textarea id="descripcion" class="form-control" rows="3"></textarea>
            </form>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
              <button type="button" class="btn btn-primary">Guardar</button>
            </div>
          </div>
        </div>
      </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
</body>
</html>
