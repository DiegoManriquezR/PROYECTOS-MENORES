{% extends 'base/base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card bg-secondary border-dark">
      <div class="card-header bg-danger border-danger">
        <h3 class="card-title mb-0 fw-bold text-light">Eliminar Sala</h3>
      </div>
      <div class="card-body text-center">
        <div class="mb-4">
          <i class="bi bi-exclamation-triangle-fill text-warning fs-1"></i>
        </div>
        <p class="text-light fs-5 mb-4">
          ¿Estás seguro que deseas eliminar la sala <strong>'{{ sala.nombre }}'</strong>?
        </p>
        <div class="alert alert-warning" role="alert">
          <small>Esta acción no se puede deshacer</small>
        </div>
        <form method="post" class="d-inline">
          {% csrf_token %}
          <button class="btn btn-danger fw-semibold me-2" type="submit">Confirmar Eliminación</button>
          <a class="btn btn-secondary fw-semibold" href="{% url 'lista_salas' %}">Cancelar</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
