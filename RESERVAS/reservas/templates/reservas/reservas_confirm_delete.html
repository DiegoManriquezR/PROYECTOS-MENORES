{% extends 'base/base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card bg-secondary border-dark">
      <div class="card-header bg-danger border-danger">
        <h3 class="card-title mb-0 fw-bold text-light">Cancelar Reserva</h3>
      </div>
      <div class="card-body text-center">
        <div class="mb-4">
          <i class="bi bi-exclamation-triangle-fill text-warning fs-1"></i>
        </div>
        <p class="text-light fs-5 mb-4">
          ¿Deseas cancelar la reserva de <strong>'{{ reserva.usuario }}'</strong> en la sala <strong>'{{ reserva.sala }}'</strong>?
        </p>
        <div class="alert alert-info" role="alert">
          <small>Fecha y hora: {{ reserva.fecha_hora|date:"d/m/Y H:i" }}</small>
        </div>
        <form method="post" class="d-inline">
          {% csrf_token %}
          <button class="btn btn-danger fw-semibold me-2" type="submit">Confirmar Cancelación</button>
          <a class="btn btn-secondary fw-semibold" href="{% url 'lista_reservas' %}">Volver</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
